name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run isolated regression checks
        shell: powershell
        run: .\package.ps1 -Test
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GAMES-windows-x64
          path: dist/*
          if-no-files-found: error
