name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and run isolated regression checks
        shell: powershell
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '1.0.9' }
          .\package.ps1 -Version $version -Test
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: GAMES-windows-x64
          path: dist/*
          if-no-files-found: error
