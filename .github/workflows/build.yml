name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Build and run isolated regression checks
        shell: powershell
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '1.0.19' }
          try { .\package.ps1 -Version $version -Test }
          catch {
            $details = @($_.Exception.Message)
            Get-ChildItem out -Filter test-result.txt -Recurse -ErrorAction SilentlyContinue | ForEach-Object { $details += [IO.File]::ReadAllText($_.FullName) }
            $message = ($details -join " | ").Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error::$message"
            throw
          }
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: GAMES-windows-x64
          path: dist/*
          if-no-files-found: error

      - name: Publish tagged Windows release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v')
          gh release create $tag "dist/GAMES.exe" "dist/GAMES-v$version-windows-x64.zip" "dist/SHA256SUMS.txt" --verify-tag --latest --title "GAMES $tag · Windows x64" --notes-file "docs/releases/$tag.md"
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
